<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Collection</title>

<style>
  /* ============================================================
     全局基础设置（和 index.html 保持同一套风格）
  ============================================================ */
  :root{
    --bg: #0a0a0a;
    --text: #f5f5f5;
    --text-dim: #9a9a9a;
    --line: rgba(255,255,255,0.1);
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html{
    scroll-behavior: smooth;
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.8;
    overflow-x: hidden;
  }

  img{
    display:block;
    max-width:100%;
  }

  /* ============================================================
     密码验证屏
  ============================================================ */
  #password-screen{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
  }

  .password-inner{
    max-width: 380px;
    width: 100%;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeInUp 1.2s ease forwards;
    animation-delay: 0.2s;
  }

  @keyframes fadeInUp{
    to{ opacity:1; transform: translateY(0); }
  }

  .private-label{
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .private-desc{
    font-size: 15px;
    color: #d0d0d0;
    font-weight: 300;
    margin-bottom: 6px;
  }

  .private-desc + .private-desc{
    margin-bottom: 32px;
  }

  .password-input-row{
    display:flex;
    gap: 10px;
    justify-content:center;
    margin-bottom: 18px;
  }

  /* ✏️ 密码输入框样式，一般不需要改 */
  #password-input{
    width: 160px;
    padding: 12px 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    letter-spacing: 0.3em;
    text-align: center;
    outline: none;
    transition: border-color 0.3s ease;
  }

  #password-input:focus{
    border-color: rgba(255,255,255,0.6);
  }

  #enter-btn{
    padding: 12px 22px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #enter-btn:hover{
    background: var(--text);
    color: var(--bg);
  }

  /* ✏️【可修改】密码提示文字样式 */
  .password-hint{
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    margin-bottom: 14px;
  }

  .password-error{
    font-size: 13px;
    color: #d0d0d0;
    min-height: 20px;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .password-error.show{
    opacity: 1;
  }

  .password-error.success{
    color: var(--text);
    letter-spacing: 0.2em;
  }

  /* 输错密码时输入框轻微抖动 */
  @keyframes shake{
    0%, 100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }

  #password-input.shake{
    animation: shake 0.3s ease;
    border-color: rgba(255,255,255,0.5);
  }

  /* ============================================================
     隐藏内容整体
  ============================================================ */
  #hidden-content{
    display:none; /* 密码正确后由 JS 改成 block */
  }

  .fade-section{
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  .fade-section.is-visible{
    opacity: 1;
    transform: translateY(0);
  }

  /* ============================================================
     第一部分：声音
  ============================================================ */
  .voice-block{
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
  }

  /* ✏️【可修改】声音部分的提示文字 */
  .voice-line{
    font-size: clamp(16px, 3vw, 20px);
    color: #d0d0d0;
    font-weight: 300;
    letter-spacing: 0.03em;
    margin-bottom: 48px;
  }

  #play-btn{
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    background: transparent;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.4s ease;
  }

  #play-btn:hover{
    background: var(--text);
    color: var(--bg);
    transform: scale(1.05);
  }

  #play-btn.playing{
    opacity: 0.4;
    cursor: default;
  }

  .playing-label{
    margin-top: 22px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .playing-label.show{
    opacity: 1;
  }

  /* ============================================================
     第二部分：照片，一张一张出现，留白很多
  ============================================================ */
  .memory-photo{
    min-height: 70vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 80px 24px;
  }

  .memory-photo img{
    max-width: 480px;
    width: 100%;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }

  /* ============================================================
     第三部分：最后一句话
  ============================================================ */
  .final-line{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
  }

  /* ✏️【可修改】最后一句话的文字样式 */
  .final-line p{
    font-size: clamp(20px, 3.4vw, 28px);
    font-weight: 300;
    color: var(--text);
    line-height: 1.9;
  }

</style>
</head>
<body>

  <!-- ============================================================
       密码验证屏
       ✏️ 修改密码：在页面最下方 <script> 里找 CORRECT_PASSWORD
       ✏️ 修改密码提示文字：改下面 class="password-hint" 那一行
  ============================================================ -->
  <section id="password-screen">
    <div class="password-inner">
      <div class="private-label">Private Collection</div>
      <p class="private-desc">是给你看的嘛就看！。</p>
      <p class="private-desc">请输入密码</p>

      <div class="password-input-row">
        <input
          type="password"
          id="password-input"
          maxlength="6"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
        >
        <button id="enter-btn">ENTER</button>
      </div>

      <!-- ✏️【可修改】密码提示文字，随便写，只有你和她能看懂就行 -->
      <p class="password-hint">提示：去星叶那天是哪天呢 hhhhh</p>

      <p id="password-error" class="password-error"></p>
    </div>
  </section>


  <!-- ============================================================
       隐藏内容（密码正确后才会显示）
  ============================================================ -->
  <div id="hidden-content">

    <!-- ----------------------------------------------------------
         第一部分：声音
         ✏️【替换录音】把 voice-hidden.mp3 换成你自己的录音文件
         建议时长 1～3 分钟，就当作面对面在跟她说话，不用讲得太正式
    ---------------------------------------------------------- -->
    <section class="voice-block fade-section">
      <!-- ✏️【可修改】声音部分上方的文字 -->
      <p class="voice-line">看来是给你看的hhhhhh</p>

      <button id="play-btn" aria-label="播放">▶</button>
      <div class="playing-label" id="playing-label">正在播放</div>

      <audio id="hidden-audio" preload="auto">
        <source src="voice-hidden.mp3" type="audio/mpeg">
      </audio>
    </section>

    <!-- ----------------------------------------------------------
         第二部分：照片
         ✏️【替换图片】把 memory1.jpg ~ memory8.jpg 换成你自己的照片
         不需要凑够 8 张，用不到的编号不上传对应文件就行，
         页面会自动跳过缺失的照片，不会露出破图或者留空白格子。
    ---------------------------------------------------------- -->
    <section class="memory-photo fade-section">
      <img src="memory1.jpg" alt="memory 1" onerror="this.closest('.memory-photo').style.display='none'">
    </section>

    <section class="memory-photo fade-section">
      <img src="memory2.jpg" alt="memory 2" onerror="this.closest('.memory-photo').style.display='none'">
    </section>

    <section class="memory-photo fade-section">
      <img src="memory3.jpg" alt="memory 3" onerror="this.closest('.memory-photo').style.display='none'">
    </section>

    <section class="memory-photo fade-section">
      <img src="memory4.jpg" alt="memory 4" onerror="this.closest('.memory-photo').style.display='none'">
    </section>

    <section class="memory-photo fade-section">
      <img src="memory5.jpg" alt="memory 5" onerror="this.closest('.memory-photo').style.display='none'">
    </section>

    <section class="memory-photo fade-section">
      <img src="memory6.jpg" alt="memory 6" onerror="this.closest('.memory-photo').style.display='none'">
    </section>

    <section class="memory-photo fade-section">
      <img src="memory7.jpg" alt="memory 7" onerror="this.closest('.memory-photo').style.display='none'">
    </section>

    <section class="memory-photo fade-section">
      <img src="memory8.jpg" alt="memory 8" onerror="this.closest('.memory-photo').style.display='none'">
    </section>

    <!-- ----------------------------------------------------------
         第三部分：最后一句话
         ✏️【可修改】下面这段文字，换行会保留
    ---------------------------------------------------------- -->
    <section class="final-line fade-section">
      <p>
姐姐要天天开心 要是不开心了 我在这里一直陪着你！hhhhh
      </p>
    </section>

  </div>


  <script>
    // ============================================================
    // 密码设置
    // ✏️【可修改】把下面引号里的数字换成你自己的密码（建议保持6位数字）
    // ============================================================
    const CORRECT_PASSWORD = '260620';

    const passwordScreen = document.getElementById('password-screen');
    const hiddenContent  = document.getElementById('hidden-content');
    const passwordInput  = document.getElementById('password-input');
    const enterBtn       = document.getElementById('enter-btn');
    const errorEl        = document.getElementById('password-error');

    function tryUnlock(){
      const value = passwordInput.value.trim();

      if(value === CORRECT_PASSWORD){
        // 密码正确
        errorEl.textContent = 'ACCESS GRANTED';
        errorEl.classList.add('show', 'success');

        // 稍微停顿一下，让"ACCESS GRANTED"被看到，再进入隐藏页面
        setTimeout(() => {
          passwordScreen.style.display = 'none';
          hiddenContent.style.display = 'block';
          initFadeObserver(); // 隐藏内容显示后，才开始监听滚动淡入
        }, 900);

      } else {
        // 密码错误
        errorEl.textContent = '不对，再想想。';
        errorEl.classList.remove('success');
        errorEl.classList.add('show');

        passwordInput.classList.remove('shake');
        // 强制重绘以便动画可以重复播放
        void passwordInput.offsetWidth;
        passwordInput.classList.add('shake');
      }
    }

    enterBtn.addEventListener('click', tryUnlock);

    passwordInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        tryUnlock();
      }
    });

    // ============================================================
    // 播放按钮逻辑
    // ============================================================
    const playBtn = document.getElementById('play-btn');
    const audio = document.getElementById('hidden-audio');
    const playingLabel = document.getElementById('playing-label');

    playBtn.addEventListener('click', function(){
      audio.play();
      playBtn.classList.add('playing');
      playBtn.disabled = true;
      playingLabel.classList.add('show');
    });

    audio.addEventListener('ended', function(){
      playingLabel.classList.remove('show');
      playBtn.classList.remove('playing');
      playBtn.disabled = false;
    });

    // ============================================================
    // 滚动淡入效果（隐藏内容显示后才启用，避免提前触发）
    // ============================================================
    function initFadeObserver(){
      const fadeEls = document.querySelectorAll('#hidden-content .fade-section');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.15
      });

      fadeEls.forEach(el => observer.observe(el));
    }
  </script>

</body>
</html>
