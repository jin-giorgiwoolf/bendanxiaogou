<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小狗生日要快乐</title>

<style>
  /* ============================================================
     全局基础设置
  ============================================================ */
  :root{
    --bg: #0a0a0a;
    --bg-soft: #111111;
    --text: #f5f5f5;
    --text-dim: #9a9a9a;
    --line: rgba(255,255,255,0.08);
    --accent: #ffffff;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html{
    scroll-behavior: smooth;
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.8;
    overflow-x: hidden;
  }

  img{
    display:block;
    max-width:100%;
  }

  /* ============================================================
     首页 Hero 区域
  ============================================================ */
  .hero{
    height: 100vh;
    width: 100%;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background: var(--bg);
    position: relative;
    padding: 0 24px;
  }

  .hero-inner{
    opacity: 0;
    transform: translateY(16px);
    animation: heroFadeIn 1.6s ease forwards;
    animation-delay: 0.3s;
  }

  @keyframes heroFadeIn{
    to{
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ============================================================
     ✏️ 【可修改】首页主标题文字
     直接修改下面这一行里的文字即可
  ============================================================ */
  .hero-title{
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--text);
    margin-bottom: 18px;
  }

  /* ✏️ 【可修改】首页副标题 / 小字说明 */
  .hero-subtitle{
    font-size: clamp(13px, 2vw, 16px);
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 56px;
  }

  .start-btn{
    display:inline-block;
    padding: 14px 40px;
    border: 1px solid rgba(255,255,255,0.35);
    color: var(--text);
    background: transparent;
    font-size: 14px;
    letter-spacing: 0.1em;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.4s ease;
  }

  .start-btn:hover{
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .scroll-hint{
    position:absolute;
    bottom: 40px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    opacity: 0.6;
    animation: bounce 2.4s ease-in-out infinite;
  }

  @keyframes bounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(8px); }
  }

  /* ============================================================
     章节通用样式
  ============================================================ */
  .chapter{
    max-width: 860px;
    margin: 0 auto;
    padding: 140px 24px;
    border-bottom: 1px solid var(--line);
  }

  .chapter:last-of-type{
    border-bottom: none;
  }

  /* 滚动淡入效果的初始 / 触发状态，由 JS 控制 class 切换 */
  .fade-section{
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1s ease, transform 1s ease;
  }

  .fade-section.is-visible{
    opacity: 1;
    transform: translateY(0);
  }

  .chapter-index{
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* ✏️ 【可修改】章节标题样式对应的文字在 HTML 主体里修改 */
  .chapter-title{
    font-size: clamp(24px, 4vw, 38px);
    font-weight: 300;
    letter-spacing: 0.02em;
    margin-bottom: 28px;
  }

  /* 章节开头的大字短句，用来代替标题的位置 */
  .chapter-lead{
    font-size: clamp(22px, 3.6vw, 32px);
    font-weight: 300;
    letter-spacing: 0.01em;
    color: var(--text);
    max-width: 560px;
    margin-bottom: 40px;
  }

  /* ✏️ 【可修改】章节正文文字样式 */
  .chapter-text{
    font-size: 16px;
    color: #d0d0d0;
    font-weight: 300;
    max-width: 640px;
    margin-bottom: 44px;
    white-space: pre-line; /* 保留换行 */
  }

  /* ============================================================
     视频区域
  ============================================================ */
  .video-wrapper{
    width: 100%;
    margin-bottom: 44px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    background: #000;
  }

  video{
    width: 100%;
    display:block;
    max-height: 70vh;
    background: #000;
  }

  /* ============================================================
     图片展示区域
  ============================================================ */
  .photo-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 640px){
    .photo-grid{
      grid-template-columns: 1fr;
    }
  }

  .photo-item{
    overflow:hidden;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .photo-item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.0);
    transition: transform 1.2s ease;
  }

  .photo-item:hover img{
    transform: scale(1.06);
  }

  /* ============================================================
     结尾感谢页面
  ============================================================ */
  .finale{
    height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
    background: linear-gradient(180deg, var(--bg) 0%, #050505 100%);
  }

  /* ✏️ 【可修改】结尾祝福文字 */
  .finale-text{
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 300;
    max-width: 700px;
    line-height: 1.9;
    margin-bottom: 48px;
    white-space: pre-line;
  }

  .audio-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
  }

  .audio-label{
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  audio{
    width: min(320px, 80vw);
  }

  .finale-signature{
    margin-top: 60px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* ============================================================
     顶部固定小导航（可选，简洁不打扰）
  ============================================================ */
  .top-nav{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 32px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    z-index: 100;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
    pointer-events: none;
  }

</style>
</head>
<body>

  <!-- 顶部小水印导航已移除，如需恢复可参考历史版本 -->

  <!-- ============================================================
       首页 Hero 区域
       ✏️ 修改标题 / 副标题 / 按钮文字 在下方 hero-title / hero-subtitle
  ============================================================ -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-title">生日快乐咯</div>
      <div class="hero-subtitle">来看看我给你准备了什么吧！hhhhh</div>
      <a href="#chapter1" class="start-btn">开始观看</a>
    </div>
    <div class="scroll-hint">向下滚动</div>
  </section>

  <!-- ============================================================
       章节一
       ✏️ 复制这一整个 <section class="chapter fade-section"> 块
          即可添加更多章节，记得修改 id（如 chapter2, chapter3...）
  ============================================================ -->
  <section class="chapter fade-section" id="chapter1">
    <!-- ✏️【可修改】章节标题 -->
    <!-- ✏️【可修改】章节标题（如需恢复，取消下方注释）
    <h2 class="chapter-title">序</h2>
    -->

    <!-- ✏️【可修改】章节开头的一句话，换行会保留 -->
    <p class="chapter-lead">
这封信，我想念给你听。
    </p>

    <!-- ✏️【替换视频】把 video1.mp4 换成你自己的视频文件名（这里是读手写信的视频） -->
    <div class="video-wrapper">
      <video controls playsinline preload="metadata" poster="">
        <source src="video1.mp4" type="video/mp4">
        您的浏览器不支持 video 标签。
      </video>
    </div>

    <!-- ✏️【替换图片】把 photo1.jpg / photo2.jpg 换成手写信的照片 -->
    <div class="photo-grid">
      <div class="photo-item">
        <img src="photo1.jpg" alt="手写信">
      </div>
      <div class="photo-item">
        <img src="photo2.jpg" alt="手写信">
      </div>
    </div>
  </section>

  <!-- ============================================================
       章节二（示例，可继续复制增加）
  ============================================================ -->
  <section class="chapter fade-section" id="chapter2">
    <!-- ✏️【可修改】章节标题（如需恢复，取消下方注释）
    <h2 class="chapter-title">幕后</h2>
    -->

    <!-- ✏️【可修改】章节开头的一句话，换行会保留 -->
    <p class="chapter-lead">
这段视频，是关于瞒着你的那些事。
    </p>

    <!-- ✏️【替换视频】把 video2.mp4 换成你自己的视频文件名（这里是幕后花絮+旁白） -->
    <div class="video-wrapper">
      <video controls playsinline preload="metadata">
        <source src="video2.mp4" type="video/mp4">
        您的浏览器不支持 video 标签。
      </video>
    </div>

    <!-- 如果这一章节不需要图片，可以删除下面整个 photo-grid 区块 -->
    <div class="photo-grid">
      <div class="photo-item">
        <img src="photo1.jpg" alt="照片三">
      </div>
      <div class="photo-item">
        <img src="photo2.jpg" alt="照片四">
      </div>
    </div>
  </section>

  <!-- ============================================================
       ✏️ 想要更多章节，从这里开始复制粘贴上面的 <section> 结构
       记得：
       1. id 改成 chapter3、chapter4...
       2. 标题、正文、视频文件名、图片文件名都替换成新的
  ============================================================ -->


  <!-- ============================================================
       结尾感谢页面
       ✏️ 修改祝福语文字 / 替换 voice.mp3 为你的录音文件
  ============================================================ -->
  <section class="finale fade-section" id="finale">
    <!-- ✏️【可修改】最终的生日祝福文字，换行会保留 -->
    <div class="finale-text">
生日快乐。
愿这一年，所有认真的努力都被看见，
所有安静的等待都有回响。
    </div>

    <div class="audio-wrapper">
      <div class="audio-label">给你唱首生日歌</div>
      <!-- ✏️【替换录音】把 voice.mp3 换成你唱生日歌的录音文件名 -->
      <audio controls>
        <source src="voice.mp3" type="audio/mpeg">
        您的浏览器不支持 audio 标签。
      </audio>
    </div>
  </section>


  <script>
    // ============================================================
    // 滚动淡入效果
    // 所有带有 class="fade-section" 的区块，
    // 滚动进入视口时会自动淡入显示
    // ============================================================
    const fadeEls = document.querySelectorAll('.fade-section');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          // 淡入一次后不再重复触发，取消观察，提升性能
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.15
    });

    fadeEls.forEach(el => observer.observe(el));

    // ============================================================
    // 平滑滚动（部分旧浏览器兼容处理）
    // "开始观看" 按钮已经通过 CSS scroll-behavior: smooth 实现
    // 这里做一个兜底，防止某些浏览器不支持
    // ============================================================
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e){
        const targetId = this.getAttribute('href');
        const target = document.querySelector(targetId);
        if(target){
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });
  </script>

</body>
</html>
